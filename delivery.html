<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcel Box - Delivery Courier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #6366f1;
      --emerald: #10b981;
      --rose: #f43f5e;
      --amber: #f59e0b;
      --font: 'Plus Jakarta Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-icon {
      font-size: 1.5rem;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .connect-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .connect-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .connect-btn.connected {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .connected .dot {
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    /* Box Hardware Status Banner */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .lock-pill-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all 0.3s;
    }

    .state-locked .lock-pill-icon {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--rose);
    }

    .state-unlocked .lock-pill-icon {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--emerald);
    }

    .state-pending .lock-pill-icon {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--amber);
      animation: spin-pulse 1.2s infinite;
    }

    @keyframes spin-pulse {
      0% { transform: scale(0.96); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.8; }
    }

    .status-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .status-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.75rem 1.5rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .input-otp {
      width: 100%;
      background: #060912;
      border: 2px solid var(--card-border);
      border-radius: 14px;
      color: #ffffff;
      font-family: var(--mono);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-align: center;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border 0.2s;
    }

    .input-otp:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .input-otp::placeholder {
      letter-spacing: 0.1em;
      color: var(--text-dim);
      font-size: 1.5rem;
    }

    .btn {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 1.25rem;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-unlock {
      background: linear-gradient(135deg, #059669, #047857);
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
    }
    .btn-unlock:hover:not(:disabled) {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .btn-lock {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.35);
    }
    .btn-lock:hover:not(:disabled) {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
    }

    .btn-secondary-lock {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      box-shadow: none;
    }
    .btn-secondary-lock:hover:not(:disabled) {
      background: rgba(244, 63, 94, 0.25);
      color: #fff;
    }

    .btn-banner-close {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.45rem 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn-banner-close:hover {
      background: rgba(244, 63, 94, 0.3);
      color: #fff;
      box-shadow: 0 2px 10px rgba(244, 63, 94, 0.3);
    }
    .btn-banner-close:active {
      transform: translateY(1px);
    }

    .msg {
      font-size: 0.88rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    .msg.show {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .msg-error {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .msg-success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .msg-info {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-icon">📦</span>
        <span class="brand-name">Delivery Courier</span>
      </div>
      <button id="btnConnect" class="connect-btn" type="button" title="Connect Box via USB">
        <span class="dot"></span>
        <span id="connectLabel">Connect Box</span>
      </button>
    </header>

    <!-- Box Status Banner -->
    <div class="status-card state-locked" id="statusCard">
      <div class="status-left">
        <div class="lock-pill-icon" id="lockIcon">🔒</div>
        <div>
          <div class="status-title" id="statusTitle">Box Locked</div>
          <div class="status-subtitle" id="statusSubtitle">Secure &amp; ready for delivery</div>
        </div>
      </div>
      <button id="btnBannerClose" class="btn-banner-close" type="button" title="Close / Lock Box (Send 0)">
        🔒 Close Box
      </button>
    </div>

    <main class="card">
      <h1 class="card-title">Courier Access</h1>
      <p class="card-desc">Enter the 6-digit OTP code provided by the box owner to unlock the box.</p>

      <label for="inputOtp" class="sr-only">Enter 6-Digit Delivery Code</label>
      <input 
        type="text" 
        id="inputOtp" 
        class="input-otp" 
        maxlength="6" 
        placeholder="000000" 
        inputmode="numeric" 
        autocomplete="off"
        aria-label="Enter 6-digit delivery code"
      >

      <button id="btnUnlock" class="btn btn-unlock" type="button">
        🔓 Unlock Box
      </button>

      <!-- Close Box Option (Available for demo or relocking) -->
      <button id="btnLock" class="btn btn-lock btn-secondary-lock" type="button">
        🔒 Close Box (0°)
      </button>

      <div id="deliveryMsg" class="msg" role="status"></div>
    </main>
  </div>

  <script>
    let port = null;
    let reader = null;
    let keepReading = false;
    let boxPhysicalState = 'LOCKED';
    let ackTimeout = null;

    const btnConnect = document.getElementById('btnConnect');
    const connectLabel = document.getElementById('connectLabel');
    const statusCard = document.getElementById('statusCard');
    const lockIcon = document.getElementById('lockIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusSubtitle = document.getElementById('statusSubtitle');

    const inputOtp = document.getElementById('inputOtp');
    const btnUnlock = document.getElementById('btnUnlock');
    const btnLock = document.getElementById('btnLock');
    const btnBannerClose = document.getElementById('btnBannerClose');
    const deliveryMsg = document.getElementById('deliveryMsg');

    /* Web Serial Communication */
    btnConnect.addEventListener('click', async () => {
      if (!('serial' in navigator)) {
        alert('Web Serial is not supported in this browser. Please use Google Chrome or Microsoft Edge on a desktop computer.');
        return;
      }

      // Disconnect if already open
      if (port && port.readable) {
        keepReading = false;
        try {
          if (reader) await reader.cancel();
          await port.close();
        } catch (e) {}
        port = null;
        reader = null;
        btnConnect.classList.remove('connected');
        connectLabel.textContent = 'Connect Box';
        showMsg("ESP32 disconnected.", "info");
        return;
      }

      try {
        // Request user port selection
        const selectedPort = await navigator.serial.requestPort();
        connectLabel.textContent = 'Connecting...';

        // Open serial connection at 9600 baud
        await selectedPort.open({ baudRate: 9600 });
        port = selectedPort;

        btnConnect.classList.add('connected');
        connectLabel.textContent = 'Box Connected';
        showMsg("ESP32 connected successfully at 9600 baud!", "success");

        // Start reading feedback loop
        startReading();
      } catch (err) {
        port = null;
        reader = null;
        btnConnect.classList.remove('connected');
        connectLabel.textContent = 'Connect Box';

        const msg = (err.message || "").toLowerCase();
        if (msg.includes("failed to open") || msg.includes("access denied") || msg.includes("already open") || msg.includes("busy")) {
          alert("⚠️ Could not open ESP32 Serial Port!\n\nReason: The COM port is locked by another program.\n\n👉 PLEASE CLOSE THE ARDUINO IDE SERIAL MONITOR, then click 'Connect Box' again.");
          showMsg("COM port locked by another app (e.g. Arduino IDE Serial Monitor). Close it and retry.", "error");
        } else if (msg.includes("no port selected") || msg.includes("cancelled")) {
          showMsg("Port selection cancelled.", "info");
        } else {
          alert("Serial Connection Error: " + err.message);
          showMsg("Failed to open port: " + err.message, "error");
        }
      }
    });

    // Auto-detect physical USB unplug
    if ('serial' in navigator) {
      navigator.serial.addEventListener('disconnect', (event) => {
        if (port && event.port === port) {
          keepReading = false;
          port = null;
          reader = null;
          btnConnect.classList.remove('connected');
          connectLabel.textContent = 'Connect Box';
          showMsg("ESP32 USB cable physically disconnected.", "error");
        }
      });
    }

    async function sendSerial(cmd) {
      if (!port) {
        showMsg("ESP32 is not connected via USB. Click 'Connect Box' first.", "error");
        return false;
      }
      if (!port.writable) {
        showMsg("Serial port is not writable. Click 'Connect Box' to reconnect.", "error");
        return false;
      }
      let writer;
      try {
        const encoder = new TextEncoder();
        writer = port.writable.getWriter();
        await writer.write(encoder.encode(cmd));
        return true;
      } catch (e) {
        showMsg("Serial write failed: " + e.message, "error");
        return false;
      } finally {
        if (writer) {
          try { writer.releaseLock(); } catch(err) {}
        }
      }
    }

    async function startReading() {
      keepReading = true;
      let buffer = "";
      const decoder = new TextDecoder();

      while (port && port.readable && keepReading) {
        try {
          reader = port.readable.getReader();
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value) {
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split(/\r?\n/);
              buffer = lines.pop();
              for (const line of lines) {
                const text = line.trim();
                if (text) handleAck(text);
              }
            }
          }
        } catch (err) {
          // stream aborted
        } finally {
          if (reader) {
            try { reader.releaseLock(); } catch(e) {}
          }
        }
      }
    }

    function handleAck(line) {
      if (line.includes("ACK: UNLOCKED") || line.includes("UNLOCKED")) {
        clearTimeout(ackTimeout);
        boxPhysicalState = 'UNLOCKED';
        statusCard.className = "status-card state-unlocked";
        lockIcon.textContent = "🔓";
        statusTitle.textContent = "Box Unlocked";
        statusSubtitle.textContent = "Door latch open (90°)";
        btnUnlock.style.display = 'none';
        btnLock.className = "btn btn-lock";
        btnLock.textContent = "🔒 Lock Box Now";
        showMsg("Box unlocked successfully! Please place the package inside.", "success");
      } else if (line.includes("ACK: LOCKED") || line.includes("LOCKED")) {
        clearTimeout(ackTimeout);
        boxPhysicalState = 'LOCKED';
        statusCard.className = "status-card state-locked";
        lockIcon.textContent = "🔒";
        statusTitle.textContent = "Box Locked";
        statusSubtitle.textContent = "Secure & ready for delivery";
        btnUnlock.style.display = 'inline-flex';
        btnLock.className = "btn btn-lock btn-secondary-lock";
        btnLock.textContent = "🔒 Close Box (0°)";
        showMsg("Box locked securely.", "info");
      }
    }

    function setPendingState(target) {
      statusCard.className = "status-card state-pending";
      lockIcon.textContent = "⏳";
      statusTitle.textContent = target === 'UNLOCKED' ? "Unlocking..." : "Locking...";
      statusSubtitle.textContent = "Awaiting hardware confirmation...";

      clearTimeout(ackTimeout);
      ackTimeout = setTimeout(() => {
        if (boxPhysicalState === 'AWAITING_UNLOCK' || boxPhysicalState === 'AWAITING_LOCK') {
          statusSubtitle.textContent = "No response from ESP32. Check USB connection.";
        }
      }, 5000);
    }

    async function verifyAndUnlock() {
      const code = inputOtp.value.trim();
      if (!code) {
        showMsg("Please enter the 6-digit code.", "error");
        return;
      }

      let storedOtp = null;
      let storedStatus = null;
      let storedExpires = null;

      try {
        storedOtp = localStorage.getItem('box_otp');
        storedStatus = localStorage.getItem('box_otp_status');
        storedExpires = localStorage.getItem('box_otp_expires');
      } catch (e) {}

      // Also check URL param ?otp=...
      const urlParams = new URLSearchParams(window.location.search);
      const urlOtp = urlParams.get('otp');
      const targetOtp = storedOtp || urlOtp;

      if (!targetOtp || storedStatus === 'NONE') {
        showMsg("No code has been generated by the owner yet.", "error");
        return;
      }
      if (storedStatus === 'USED') {
        showMsg("This code has already been used.", "error");
        return;
      }
      if (storedStatus === 'EXPIRED' || (storedExpires && Date.now() > parseInt(storedExpires, 10))) {
        showMsg("This code has expired. Request a new code from owner.", "error");
        return;
      }
      if (code !== targetOtp) {
        showMsg("Incorrect code. Please try again.", "error");
        return;
      }

      // Valid OTP
      try {
        localStorage.setItem('box_otp_status', 'USED');
      } catch (e) {}

      inputOtp.value = "";
      boxPhysicalState = 'AWAITING_UNLOCK';
      setPendingState('UNLOCKED');

      const sent = await sendSerial("1\n");
      if (sent) {
        showMsg("Code verified! Unlocking box...", "info");
      }
    }

    btnUnlock.addEventListener('click', verifyAndUnlock);

    async function manualRelock() {
      boxPhysicalState = 'AWAITING_LOCK';
      setPendingState('LOCKED');
      await sendSerial("0\n");
    }

    btnLock.addEventListener('click', manualRelock);
    if (btnBannerClose) {
      btnBannerClose.addEventListener('click', manualRelock);
    }

    function showMsg(txt, type) {
      deliveryMsg.className = `msg msg-${type} show`;
      const icon = type === 'error' ? '❌' : (type === 'success' ? '✅' : 'ℹ️');
      deliveryMsg.innerHTML = `<span>${icon}</span> <span>${txt}</span>`;
    }

    inputOtp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyAndUnlock();
    });

    inputOtp.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    // Auto-fill from ?otp= parameter if provided in URL
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const paramOtp = urlParams.get('otp');
      if (paramOtp && paramOtp.length === 6) {
        inputOtp.value = paramOtp;
      }
    });
  </script>
</body>
</html>
