<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcel Box - Delivery Courier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-page: #f6f3ee;
      --bg-surface: #ffffff;
      --bg-subtle: #f1ece4;
      --bg-chip: #e8e1d5;
      
      --border-light: #e4ddd3;
      --border-strong: #c8beb0;
      
      --text-main: #241a13;
      --text-secondary: #5e5044;
      --text-muted: #847466;
      --text-dim: #a6988c;
      
      --brand-primary: #5c4033;
      --brand-accent: #a3693f;
      
      --status-unlocked-bg: #eef6f0;
      --status-unlocked-border: #c8e5d0;
      --status-unlocked-text: #1e5a38;
      
      --status-locked-bg: #fdf2f0;
      --status-locked-border: #f5cdc6;
      --status-locked-text: #962a1b;

      --status-pending-bg: #fdf6ec;
      --status-pending-border: #f4deaf;
      --status-pending-text: #8e5406;

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 1px 3px rgba(60, 45, 30, 0.04);
      --shadow-md: 0 4px 16px rgba(60, 45, 30, 0.06), 0 1px 3px rgba(60, 45, 30, 0.03);
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3.5rem;
      background-image: 
        radial-gradient(ellipse at 15% 10%, rgba(195, 160, 130, 0.14) 0%, transparent 60%),
        radial-gradient(ellipse at 85% 90%, rgba(160, 125, 95, 0.1) 0%, transparent 60%);
      line-height: 1.5;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(92, 64, 51, 0.25);
    }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .connect-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.45rem 0.95rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .connect-btn:hover {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
      color: var(--text-main);
    }

    .connect-btn.connected {
      border-color: var(--status-unlocked-border);
      background: var(--status-unlocked-bg);
      color: var(--status-unlocked-text);
    }

    .connect-btn.pending {
      border-color: var(--status-pending-border);
      background: var(--status-pending-bg);
      color: var(--status-pending-text);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--text-dim);
    }

    .connected .dot {
      background: #285c41;
      box-shadow: 0 0 6px rgba(40, 92, 65, 0.6);
    }

    .status-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .lock-pill-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      transition: all 0.3s;
    }

    .state-locked .lock-pill-icon {
      background: var(--status-locked-bg);
      border: 1px solid var(--status-locked-border);
      color: var(--status-locked-text);
    }

    .state-unlocked .lock-pill-icon {
      background: var(--status-unlocked-bg);
      border: 1px solid var(--status-unlocked-border);
      color: var(--status-unlocked-text);
    }

    .state-pending .lock-pill-icon {
      background: var(--status-pending-bg);
      border: 1px solid var(--status-pending-border);
      color: var(--status-pending-text);
    }

    .status-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .status-subtitle {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .btn-banner-close {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-banner-close:hover {
      background: var(--bg-chip);
      color: var(--text-main);
      border-color: var(--border-strong);
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.5rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .input-otp {
      width: 100%;
      background: var(--bg-surface);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 0.75rem 1rem;
      outline: none;
      transition: all 0.2s;
    }

    .input-otp:focus {
      border-color: var(--brand-accent);
      box-shadow: 0 0 0 3px rgba(163, 105, 63, 0.15);
    }

    .input-otp::placeholder {
      letter-spacing: 0.15em;
      color: var(--text-dim);
      font-size: 1.6rem;
    }

    .btn {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-unlock {
      background: #285c41;
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(40, 92, 65, 0.25);
    }
    .btn-unlock:hover {
      background: #1f4732;
    }

    .btn-lock {
      background: #962a1b;
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(150, 42, 27, 0.25);
    }
    .btn-lock:hover {
      background: #7a2215;
    }

    .btn-secondary-lock {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary-lock:hover {
      background: var(--bg-chip);
    }

    .msg {
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      display: none;
      align-items: center;
      gap: 0.55rem;
    }

    .msg.show {
      display: flex;
    }

    .msg-error {
      background: var(--status-locked-bg);
      border: 1px solid var(--status-locked-border);
      color: var(--status-locked-text);
    }

    .msg-success {
      background: var(--status-unlocked-bg);
      border: 1px solid var(--status-unlocked-border);
      color: var(--status-unlocked-text);
    }

    .msg-info {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">📦</div>
        <span class="brand-name">Courier Access</span>
      </div>
      <button id="btnConnect" class="connect-btn" type="button" title="Connect Box via USB">
        <span class="dot"></span>
        <span id="connectLabel">Connect Box</span>
      </button>
    </header>

    <!-- Box Status Banner -->
    <div class="status-card state-locked" id="statusCard">
      <div class="status-left">
        <div class="lock-pill-icon" id="lockIcon">🔒</div>
        <div>
          <div class="status-title" id="statusTitle">Box Locked (90°)</div>
          <div class="status-subtitle" id="statusSubtitle">Secure &amp; latch engaged</div>
        </div>
      </div>
      <button id="btnBannerClose" class="btn-banner-close" type="button" title="Rotate Servo to 90° (Lock)">
        🔒 Close Box (90°)
      </button>
    </div>

    <main class="card">
      <h1 class="card-title">Courier Access</h1>
      <p class="card-desc">Enter the 6-digit OTP code provided by the box owner to unlock the latch.</p>

      <label for="inputOtp" class="sr-only">Enter 6-Digit Delivery Code</label>
      <input 
        type="text" 
        id="inputOtp" 
        class="input-otp" 
        maxlength="6" 
        placeholder="000000" 
        inputmode="numeric" 
        autocomplete="off"
        aria-label="Enter 6-digit delivery code"
      >

      <button id="btnUnlock" class="btn btn-unlock" type="button">
        🔓 Unlock Box (0°)
      </button>

      <button id="btnLock" class="btn btn-lock btn-secondary-lock" type="button">
        🔒 Close Box (90°)
      </button>

      <div id="deliveryMsg" class="msg" role="status"></div>
    </main>
  </div>

  <script>
    const SERVO_UNLOCK_CMD = "1\n"; // Commands ESP32 to rotate to 0 degrees
    const SERVO_LOCK_CMD   = "0\n"; // Commands ESP32 to rotate to 90 degrees
    const SERIAL_BAUD_RATE = 9600;

    let port = null;
    let reader = null;
    let keepReading = false;
    let boxPhysicalState = 'LOCKED';
    let ackTimeout = null;

    let broadcastChannel = null;
    try {
      broadcastChannel = new BroadcastChannel('parcel_box_channel');
    } catch(e) {}

    const btnConnect = document.getElementById('btnConnect');
    const connectLabel = document.getElementById('connectLabel');
    const statusCard = document.getElementById('statusCard');
    const lockIcon = document.getElementById('lockIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusSubtitle = document.getElementById('statusSubtitle');
    const btnBannerClose = document.getElementById('btnBannerClose');

    const inputOtp = document.getElementById('inputOtp');
    const btnUnlock = document.getElementById('btnUnlock');
    const btnLock = document.getElementById('btnLock');
    const deliveryMsg = document.getElementById('deliveryMsg');

    /* Web Serial Communication */
    async function initSerialConnection(auto = false) {
      if (!('serial' in navigator)) {
        if (!auto) alert('Web Serial is not supported in this browser. Please use Chrome or Edge.');
        return;
      }

      if (port && port.readable) {
        keepReading = false;
        try {
          if (reader) await reader.cancel();
          await port.close();
        } catch (e) {}
        port = null;
        reader = null;
        localStorage.removeItem('box_serial_auto');
        btnConnect.className = 'connect-btn';
        connectLabel.textContent = 'Connect Box';
        return;
      }

      try {
        let selectedPort = null;
        if (auto) {
          const ports = await navigator.serial.getPorts();
          if (ports.length > 0) selectedPort = ports[0];
          else return;
        } else {
          selectedPort = await navigator.serial.requestPort();
        }

        await selectedPort.open({ baudRate: SERIAL_BAUD_RATE });
        port = selectedPort;
        localStorage.setItem('box_serial_auto', 'true');
        btnConnect.className = 'connect-btn connected';
        connectLabel.textContent = 'Box Connected';
        showMsg("ESP32 connected successfully.", "success");
        startReading();
      } catch (err) {
        port = null;
        reader = null;
        btnConnect.className = 'connect-btn';
        connectLabel.textContent = 'Connect Box';
        if (!auto) {
          showMsg("Connection failed: " + err.message, "error");
        }
      }
    }

    btnConnect.addEventListener('click', () => initSerialConnection(false));

    async function sendSerial(cmd) {
      if (!port || !port.writable) {
        showMsg("ESP32 is not connected via USB. Click 'Connect Box' first.", "error");
        return false;
      }
      let writer;
      try {
        const encoder = new TextEncoder();
        writer = port.writable.getWriter();
        await writer.write(encoder.encode(cmd));
        return true;
      } catch (e) {
        showMsg("Serial write failed: " + e.message, "error");
        return false;
      } finally {
        if (writer) {
          try { writer.releaseLock(); } catch(err) {}
        }
      }
    }

    async function startReading() {
      keepReading = true;
      let buffer = "";
      const decoder = new TextDecoder();

      while (port && port.readable && keepReading) {
        try {
          reader = port.readable.getReader();
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value) {
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split(/\r?\n/);
              buffer = lines.pop();
              for (const line of lines) {
                const text = line.trim();
                if (text) handleAck(text);
              }
            }
          }
        } catch (err) {
        } finally {
          if (reader) {
            try { reader.releaseLock(); } catch(e) {}
          }
        }
      }
    }

    function handleAck(line) {
      if (line.includes("ACK: UNLOCKED") || line.includes("UNLOCKED")) {
        clearTimeout(ackTimeout);
        boxPhysicalState = 'UNLOCKED';
        statusCard.className = "status-card state-unlocked";
        lockIcon.textContent = "🔓";
        statusTitle.textContent = "Box Unlocked (0°)";
        statusSubtitle.textContent = "Door latch open (0°)";
        btnUnlock.classList.add('hidden');
        btnLock.className = "btn btn-lock";
        btnLock.textContent = "🔒 Relock Box (90°)";
        showMsg("Box unlocked successfully! Please place the package inside.", "success");
      } else if (line.includes("ACK: LOCKED") || line.includes("LOCKED")) {
        clearTimeout(ackTimeout);
        boxPhysicalState = 'LOCKED';
        statusCard.className = "status-card state-locked";
        lockIcon.textContent = "🔒";
        statusTitle.textContent = "Box Locked (90°)";
        statusSubtitle.textContent = "Secure & ready for delivery (90°)";
        btnUnlock.classList.remove('hidden');
        btnLock.className = "btn btn-lock btn-secondary-lock";
        btnLock.textContent = "🔒 Close Box (90°)";
        showMsg("Box locked securely.", "info");
      }
    }

    function setPendingState(target) {
      statusCard.className = "status-card state-pending";
      lockIcon.textContent = "⏳";
      statusTitle.textContent = target === 'UNLOCKED' ? "Unlocking to 0°..." : "Locking to 90°...";
      statusSubtitle.textContent = "Awaiting hardware confirmation...";

      clearTimeout(ackTimeout);
      ackTimeout = setTimeout(() => {
        if (boxPhysicalState === 'AWAITING_UNLOCK' || boxPhysicalState === 'AWAITING_LOCK') {
          statusSubtitle.textContent = "No response from ESP32. Check USB connection.";
        }
      }, 5000);
    }

    async function verifyAndUnlock() {
      const code = inputOtp.value.trim();
      if (!code) {
        showMsg("Please enter the 6-digit code.", "error");
        return;
      }

      let storedOtp = localStorage.getItem('box_otp');
      let storedStatus = localStorage.getItem('box_otp_status');
      let storedExpires = localStorage.getItem('box_otp_expires');

      const urlParams = new URLSearchParams(window.location.search);
      const urlOtp = urlParams.get('otp');
      const targetOtp = storedOtp || urlOtp;

      if (!targetOtp || storedStatus === 'NONE') {
        showMsg("No code has been generated by the owner yet.", "error");
        return;
      }
      if (storedStatus === 'USED') {
        showMsg("This code has already been used.", "error");
        return;
      }
      if (storedStatus === 'EXPIRED' || (storedExpires && Date.now() > parseInt(storedExpires, 10))) {
        showMsg("This code has expired. Request a new code from owner.", "error");
        return;
      }
      if (code !== targetOtp) {
        showMsg("Incorrect code. Please try again.", "error");
        return;
      }

      try {
        localStorage.setItem('box_otp_status', 'USED');
      } catch (e) {}

      if (broadcastChannel) {
        broadcastChannel.postMessage({ type: 'OTP_UPDATED' });
      }

      inputOtp.value = "";
      boxPhysicalState = 'AWAITING_UNLOCK';
      setPendingState('UNLOCKED');

      const sent = await sendSerial(SERVO_UNLOCK_CMD);
      if (sent) {
        showMsg("Code verified! Unlocking box to 0°...", "info");
      }
    }

    btnUnlock.addEventListener('click', verifyAndUnlock);

    async function manualRelock() {
      boxPhysicalState = 'AWAITING_LOCK';
      setPendingState('LOCKED');
      await sendSerial(SERVO_LOCK_CMD);
    }

    btnLock.addEventListener('click', manualRelock);
    if (btnBannerClose) {
      btnBannerClose.addEventListener('click', manualRelock);
    }

    function showMsg(txt, type) {
      deliveryMsg.className = `msg msg-${type} show`;
      const icon = type === 'error' ? '❌' : (type === 'success' ? '✅' : 'ℹ️');
      deliveryMsg.innerHTML = `<span>${icon}</span> <span>${txt}</span>`;
    }

    inputOtp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyAndUnlock();
    });

    inputOtp.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const paramOtp = urlParams.get('otp');
      if (paramOtp && paramOtp.length === 6) {
        inputOtp.value = paramOtp;
      }
      if (localStorage.getItem('box_serial_auto') === 'true') {
        initSerialConnection(true);
      }
    });
  </script>
</body>
</html>
