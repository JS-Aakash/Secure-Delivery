<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcel Box - Owner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-page: #f6f3ee;
      --bg-surface: #ffffff;
      --bg-subtle: #f1ece4;
      --bg-chip: #e8e1d5;
      
      --border-light: #e4ddd3;
      --border-strong: #c8beb0;
      
      --text-main: #241a13;
      --text-secondary: #5e5044;
      --text-muted: #847466;
      --text-dim: #a6988c;
      
      --brand-primary: #5c4033;
      --brand-primary-hover: #473126;
      --brand-accent: #a3693f;
      
      --status-unlocked-bg: #eef6f0;
      --status-unlocked-border: #c8e5d0;
      --status-unlocked-text: #1e5a38;
      
      --status-locked-bg: #fdf2f0;
      --status-locked-border: #f5cdc6;
      --status-locked-text: #962a1b;

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 1px 3px rgba(60, 45, 30, 0.04);
      --shadow-md: 0 4px 16px rgba(60, 45, 30, 0.06), 0 1px 3px rgba(60, 45, 30, 0.03);
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3.5rem;
      background-image: 
        radial-gradient(ellipse at 15% 10%, rgba(195, 160, 130, 0.14) 0%, transparent 60%),
        radial-gradient(ellipse at 85% 90%, rgba(160, 125, 95, 0.1) 0%, transparent 60%);
      line-height: 1.5;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(92, 64, 51, 0.25);
    }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .nav-link:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .btn-signout {
      cursor: pointer;
      border-color: var(--border-light);
      color: var(--text-secondary);
    }
    .btn-signout:hover {
      background: #faece9;
      color: var(--status-locked-text);
      border-color: var(--status-locked-border);
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.5rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .otp-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
    }

    .otp-digits {
      font-family: var(--font-mono);
      font-size: 2.85rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-indent: 0.25em;
      color: var(--text-main);
    }

    .otp-digits.placeholder {
      color: var(--text-dim);
      font-size: 2.4rem;
    }

    .otp-tag {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
    }

    .tag-none {
      background: var(--bg-chip);
      color: var(--text-secondary);
    }
    .tag-active {
      background: var(--status-unlocked-bg);
      color: var(--status-unlocked-text);
      border: 1px solid var(--status-unlocked-border);
    }
    .tag-expired {
      background: var(--status-locked-bg);
      color: var(--status-locked-text);
      border: 1px solid var(--status-locked-border);
    }
    .tag-used {
      background: var(--bg-chip);
      color: var(--text-muted);
    }

    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 0 0.2rem;
    }

    .timer-track {
      width: 100%;
      height: 6px;
      background: var(--bg-chip);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 0.35rem;
    }

    .timer-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--brand-accent), #285c41);
      transition: width 1s linear;
    }

    .timer-fill.warn {
      background: linear-gradient(90deg, #b4690e, #b93826);
    }

    .btn {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--brand-primary);
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(92, 64, 51, 0.25);
    }
    .btn-primary:hover {
      background: var(--brand-primary-hover);
    }

    .btn-copy {
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 0.85rem;
      padding: 0.45rem 0.95rem;
      border-radius: var(--radius-sm);
      width: auto;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .btn-copy:hover {
      background: var(--bg-chip);
      color: var(--text-main);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">📦</div>
        <span class="brand-name">Owner Portal</span>
      </div>
      <div class="header-actions">
        <button id="btnLogout" class="nav-link btn-signout" type="button">Sign Out</button>
        <a href="delivery.html" class="nav-link">Courier →</a>
      </div>
    </header>

    <main class="card">
      <h1 class="card-title">Generate Delivery Code</h1>
      <p class="card-desc">Generate a single-use 6-digit access code for your expected courier. Each code automatically expires after 5 minutes.</p>

      <div class="otp-box">
        <span class="otp-tag tag-none" id="otpTag">No Active Code</span>
        <div class="otp-digits placeholder" id="otpDigits">------</div>
        <button id="btnCopy" class="btn btn-copy hidden" type="button">
          📋 Copy Code
        </button>
      </div>

      <div id="timerContainer" class="hidden">
        <div class="timer-row">
          <span>Code expires in:</span>
          <strong id="timerText">05:00</strong>
        </div>
        <div class="timer-track">
          <div id="timerFill" class="timer-fill"></div>
        </div>
      </div>

      <button id="btnGenerate" class="btn btn-primary" type="button">
        ⚡ Generate New Code
      </button>
    </main>
  </div>

  <script>
    const OTP_SECONDS = 300;
    let activeOtp = null;
    let otpExpiresAt = null;
    let timerInterval = null;

    let broadcastChannel = null;
    try {
      broadcastChannel = new BroadcastChannel('parcel_box_channel');
    } catch(e) {}

    const otpTag = document.getElementById('otpTag');
    const otpDigits = document.getElementById('otpDigits');
    const btnCopy = document.getElementById('btnCopy');
    const btnGenerate = document.getElementById('btnGenerate');
    const timerContainer = document.getElementById('timerContainer');
    const timerText = document.getElementById('timerText');
    const timerFill = document.getElementById('timerFill');
    const btnLogout = document.getElementById('btnLogout');

    function syncOtp() {
      try {
        const storedOtp = localStorage.getItem('box_otp');
        const storedExpires = localStorage.getItem('box_otp_expires');
        const storedStatus = localStorage.getItem('box_otp_status');

        if (storedOtp && storedExpires) {
          const exp = parseInt(storedExpires, 10);
          const diff = exp - Date.now();

          if (storedStatus === 'USED') {
            activeOtp = storedOtp;
            clearInterval(timerInterval);
            otpDigits.textContent = activeOtp;
            otpDigits.classList.remove('placeholder');
            otpTag.className = "otp-tag tag-used";
            otpTag.textContent = "Used";
            btnCopy.classList.remove('hidden');
            timerContainer.classList.add('hidden');
          } else if (diff > 0 && storedStatus === 'ACTIVE') {
            activeOtp = storedOtp;
            otpExpiresAt = exp;
            otpDigits.textContent = activeOtp;
            otpDigits.classList.remove('placeholder');
            otpTag.className = "otp-tag tag-active";
            otpTag.textContent = "Active";
            btnCopy.classList.remove('hidden');
            timerContainer.classList.remove('hidden');
            startTimer();
          } else {
            activeOtp = storedOtp;
            clearInterval(timerInterval);
            localStorage.setItem('box_otp_status', 'EXPIRED');
            otpDigits.textContent = activeOtp;
            otpDigits.classList.remove('placeholder');
            otpTag.className = "otp-tag tag-expired";
            otpTag.textContent = "Expired";
            timerText.textContent = "00:00";
            timerFill.style.width = "0%";
            btnCopy.classList.remove('hidden');
            timerContainer.classList.remove('hidden');
          }
        }
      } catch (e) {}
    }

    function generateOtp() {
      activeOtp = Math.floor(100000 + Math.random() * 900000).toString();
      otpExpiresAt = Date.now() + OTP_SECONDS * 1000;

      try {
        localStorage.setItem('box_otp', activeOtp);
        localStorage.setItem('box_otp_expires', otpExpiresAt.toString());
        localStorage.setItem('box_otp_status', 'ACTIVE');
      } catch (e) {}

      if (broadcastChannel) {
        broadcastChannel.postMessage({ type: 'OTP_UPDATED' });
      }

      otpDigits.textContent = activeOtp;
      otpDigits.classList.remove('placeholder');
      otpTag.className = "otp-tag tag-active";
      otpTag.textContent = "Active";
      btnCopy.classList.remove('hidden');
      timerContainer.classList.remove('hidden');

      startTimer();
    }

    btnGenerate.addEventListener('click', generateOtp);

    function startTimer() {
      clearInterval(timerInterval);
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (!otpExpiresAt) {
        clearInterval(timerInterval);
        return;
      }
      const diff = otpExpiresAt - Date.now();
      if (diff <= 0) {
        clearInterval(timerInterval);
        try { localStorage.setItem('box_otp_status', 'EXPIRED'); } catch(e) {}
        otpTag.className = "otp-tag tag-expired";
        otpTag.textContent = "Expired";
        timerText.textContent = "00:00";
        timerFill.style.width = "0%";
        return;
      }
      const secs = Math.ceil(diff / 1000);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      timerText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      const pct = (secs / OTP_SECONDS) * 100;
      timerFill.style.width = pct + "%";
      if (secs < 60) {
        timerFill.classList.add('warn');
      } else {
        timerFill.classList.remove('warn');
      }
    }

    function copyOtp() {
      if (!activeOtp) return;
      navigator.clipboard.writeText(activeOtp);
      btnCopy.textContent = "✓ Copied!";
      setTimeout(() => { btnCopy.textContent = "📋 Copy Code"; }, 1500);
    }

    btnCopy.addEventListener('click', copyOtp);

    if (btnLogout) {
      btnLogout.addEventListener('click', () => {
        localStorage.removeItem('owner_authenticated');
        sessionStorage.removeItem('owner_authenticated');
        window.location.href = 'login.html';
      });
    }

    window.addEventListener('storage', (e) => {
      if (e.key && e.key.startsWith('box_otp')) {
        syncOtp();
      }
    });

    if (broadcastChannel) {
      broadcastChannel.onmessage = (event) => {
        if (event.data && event.data.type === 'OTP_UPDATED') {
          syncOtp();
        }
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('owner_authenticated') !== 'true') {
        window.location.href = 'login.html?redirect=owner.html';
        return;
      }
      syncOtp();
    });
  </script>
</body>
</html>
