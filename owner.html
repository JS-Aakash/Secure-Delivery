<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcel Box - Owner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --emerald: #10b981;
      --rose: #f43f5e;
      --amber: #f59e0b;
      --font: 'Plus Jakarta Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-icon {
      font-size: 1.5rem;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.75rem 1.5rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .otp-box {
      background: #060912;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .otp-digits {
      font-family: var(--mono);
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      color: #ffffff;
    }

    .otp-digits.placeholder {
      color: var(--text-dim);
      font-size: 2.2rem;
    }

    .otp-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
    }

    .tag-none {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-dim);
    }
    .tag-active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .tag-expired {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .tag-used {
      background: rgba(100, 116, 139, 0.2);
      color: #94a3b8;
    }

    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 0 0.2rem;
    }

    .timer-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.3rem;
    }

    .timer-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--emerald));
      transition: width 1s linear;
    }

    .timer-fill.warn {
      background: linear-gradient(90deg, var(--amber), var(--rose));
    }

    .btn {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 1.25rem;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      width: auto;
      border: 1px solid var(--card-border);
    }
    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .btn-signout {
      cursor: pointer;
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-icon">📦</span>
        <span class="brand-name">Owner Portal</span>
      </div>
      <div class="header-actions">
        <button id="btnLogout" class="nav-link btn-signout" type="button">Sign Out</button>
        <a href="delivery.html" class="nav-link">Delivery →</a>
      </div>
    </header>

    <main class="card">
      <h1 class="card-title">Generate Delivery Code</h1>
      <p class="card-desc">Generate a single-use 6-digit access code for your expected courier. Each code automatically expires after 5 minutes.</p>

      <div class="otp-box">
        <span class="otp-tag tag-none" id="otpTag">No Active Code</span>
        <div class="otp-digits placeholder" id="otpDigits">------</div>
        <button id="btnCopy" class="btn btn-copy hidden" type="button">
          📋 Copy Code
        </button>
      </div>

      <div id="timerContainer" class="hidden">
        <div class="timer-row">
          <span>Code expires in:</span>
          <strong id="timerText">05:00</strong>
        </div>
        <div class="timer-track">
          <div id="timerFill" class="timer-fill"></div>
        </div>
      </div>

      <button id="btnGenerate" class="btn btn-primary" type="button">
        ⚡ Generate New Code
      </button>
    </main>
  </div>

  <script>
    const OTP_SECONDS = 300;
    let activeOtp = null;
    let otpExpiresAt = null;
    let timerInterval = null;

    const otpTag = document.getElementById('otpTag');
    const otpDigits = document.getElementById('otpDigits');
    const btnCopy = document.getElementById('btnCopy');
    const btnGenerate = document.getElementById('btnGenerate');
    const timerContainer = document.getElementById('timerContainer');
    const timerText = document.getElementById('timerText');
    const timerFill = document.getElementById('timerFill');

    function generateOtp() {
      activeOtp = Math.floor(100000 + Math.random() * 900000).toString();
      otpExpiresAt = Date.now() + OTP_SECONDS * 1000;

      try {
        localStorage.setItem('box_otp', activeOtp);
        localStorage.setItem('box_otp_expires', otpExpiresAt.toString());
        localStorage.setItem('box_otp_status', 'ACTIVE');
      } catch (e) {}

      otpDigits.textContent = activeOtp;
      otpDigits.classList.remove('placeholder');
      otpTag.className = "otp-tag tag-active";
      otpTag.textContent = "Active";
      btnCopy.classList.remove('hidden');
      timerContainer.classList.remove('hidden');

      startTimer();
    }

    btnGenerate.addEventListener('click', generateOtp);

    function startTimer() {
      clearInterval(timerInterval);
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (!otpExpiresAt) {
        clearInterval(timerInterval);
        return;
      }
      const diff = otpExpiresAt - Date.now();
      if (diff <= 0) {
        clearInterval(timerInterval);
        try { localStorage.setItem('box_otp_status', 'EXPIRED'); } catch(e) {}
        otpTag.className = "otp-tag tag-expired";
        otpTag.textContent = "Expired";
        timerText.textContent = "00:00";
        timerFill.style.width = "0%";
        return;
      }
      const secs = Math.ceil(diff / 1000);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      timerText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      const pct = (secs / OTP_SECONDS) * 100;
      timerFill.style.width = pct + "%";
      if (secs < 60) {
        timerFill.classList.add('warn');
      } else {
        timerFill.classList.remove('warn');
      }
    }

    function copyOtp() {
      if (!activeOtp) return;
      navigator.clipboard.writeText(activeOtp);
      btnCopy.textContent = "✓ Copied!";
      setTimeout(() => { btnCopy.textContent = "📋 Copy Code"; }, 1500);
    }

    const btnLogout = document.getElementById('btnLogout');
    if (btnLogout) {
      btnLogout.addEventListener('click', () => {
        localStorage.removeItem('owner_authenticated');
        sessionStorage.removeItem('owner_authenticated');
        window.location.href = 'login.html';
      });
    }

    // Check authentication and load active code from storage if still valid
    window.addEventListener('DOMContentLoaded', () => {
      // Enforce authentication
      if (localStorage.getItem('owner_authenticated') !== 'true') {
        window.location.href = 'login.html?redirect=owner.html';
        return;
      }

      try {
        const storedOtp = localStorage.getItem('box_otp');
        const storedExpires = localStorage.getItem('box_otp_expires');
        const storedStatus = localStorage.getItem('box_otp_status');

        if (storedOtp && storedExpires && storedStatus === 'ACTIVE') {
          const exp = parseInt(storedExpires, 10);
          if (exp > Date.now()) {
            activeOtp = storedOtp;
            otpExpiresAt = exp;
            otpDigits.textContent = activeOtp;
            otpDigits.classList.remove('placeholder');
            otpTag.className = "otp-tag tag-active";
            otpTag.textContent = "Active";
            btnCopy.classList.remove('hidden');
            timerContainer.classList.remove('hidden');
            startTimer();
          }
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
